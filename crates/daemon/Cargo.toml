[package]
name = "notesd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "notesd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
notes-proto = { path = "../proto" }
notes-posts = { path = "../posts" }
serde = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
