[package]
name = "notesd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "notesd"
path = "src/main.rs"

[dependencies]
# Already in the tree through fff-search; used for note content hashes.
blake3 = "1"
fff-search = "=0.11.0"
libc = "0.2"
notes-proto = { path = "../proto" }
notes-posts = { path = "../posts" }
serde = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
similar = "2"
