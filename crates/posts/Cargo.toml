[package]
name = "notes-posts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
notes-proto = { path = "../proto" }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
similar = "2"
unicode-ident = "1"
wasmi = { version = "2", features = ["simd"] }
