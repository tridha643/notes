[package]
name = "notes-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6.11"
notes-proto = { path = "../proto" }
serde_json = { version = "1", features = ["preserve_order"] }
