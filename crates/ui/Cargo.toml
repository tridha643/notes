[package]
name = "notes-ui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "notes-ui"
path = "src/main.rs"

[dependencies]
# Pinned zed main (2026-10-16). Metal shaders compile at build time (needs Xcode's Metal Toolchain).
gpui = { git = "https://github.com/zed-industries/zed", rev = "2d4c4831943153f63ad0aeddf49c8f5a3d008e75" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2d4c4831943153f63ad0aeddf49c8f5a3d008e75", features = ["font-kit"] }
