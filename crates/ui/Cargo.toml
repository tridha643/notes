[package]
name = "notes-ui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "notes-ui"
path = "src/main.rs"

[dependencies]
# Pinned zed main (2026-10-16). `runtime_shaders` compiles Metal shaders at
# launch instead of via `xcrun metal`, which Xcode CLT alone doesn't ship.
gpui = { git = "https://github.com/zed-industries/zed", rev = "2d4c4831943153f63ad0aeddf49c8f5a3d008e75" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2d4c4831943153f63ad0aeddf49c8f5a3d008e75", features = ["runtime_shaders", "font-kit"] }
