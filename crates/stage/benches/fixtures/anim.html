<!doctype html><meta charset=utf-8>
<style>
body{margin:0;background:#1e1e2e;color:#cdd6f4;font:14px -apple-system,Helvetica,sans-serif}
.wrap{padding:16px}h2{margin:0 0 8px;font-weight:500;font-size:15px}
.track{position:relative;height:60px;background:#313244;border-radius:8px;overflow:hidden}
.ball{position:absolute;top:14px;left:0;width:32px;height:32px;border-radius:50%;background:#a6e3a1;animation:go 2s ease-in-out infinite alternate}
@keyframes go{to{left:calc(100% - 32px);background:#89b4fa}}
.bars{display:flex;gap:6px;margin-top:12px;align-items:flex-end;height:50px}
.bars div{flex:1;background:#cba6f7;border-radius:3px;animation:pulse 1.2s ease-in-out infinite}
.bars div:nth-child(2n){animation-delay:.3s}.bars div:nth-child(3n){animation-delay:.6s}
@keyframes pulse{0%,100%{height:20%}50%{height:100%}}
</style>
<div class=wrap><h2>Live HTML at 60 fps</h2><div class=track><div class=ball></div></div>
<div class=bars><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
