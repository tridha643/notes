[package]
name = "stage"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "stage"
path = "src/main.rs"

[dependencies]
comrak = { version = "0.55.0", default-features = false }
crossterm = "0.29.0"
libc = "0.2.191"
notes-proto = { path = "../proto" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = "1"
serde_json = "1"
unicode-width = "0.2.2"

[[bench]]
name = "frames"
harness = false
